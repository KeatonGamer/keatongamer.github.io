Base:
  type: Window
  x:
    type: fixed
    value: -360
  y:
    type: fixed
    value: 551
  anchor:
    x: 0
    y: 1

  width:
    type: fixed
    value: 480
  height:
    type: fixed
    value: 144

  fontName: RistrettoPro-Regular
  fontSize: 25
  fontOutline: -5
  fontShadow: default

  lineHeight: default
  textPadding: default
  windowPadding: default

  windowSkin: default
  cursor: default
  customBackground:
    enable: true
    image: none

Lunatic:
  enable: true
  components:
    GoldText:
      type: Text
      x:
        type: fixed
        value: -20
      y:
        type: fixed
        value: 8
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      bind: true
      text: "${party.gold}"
    PlaytimeText:
      type: Text
      x:
        type: fixed
        value: 210
      y:
        type: fixed
        value: 8
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: -500
      bind: true
      text: "${system.playtimeText}"
    MapText:
      type: Text
      x:
        type: fixed
        value: 370
      y:
        type: fixed
        value: 8
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      bind: true
      text: "${map.displayName}"

  contents:
    type: FreeLayout
    components:
      - GoldText
      - PlaytimeText
      - MapText
