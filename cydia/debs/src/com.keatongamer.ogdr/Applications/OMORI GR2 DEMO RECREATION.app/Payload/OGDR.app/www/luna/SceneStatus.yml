type: scene
version: 0.1.0

components:
  Background:
    type: Background
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    background:
      type: default # default | none | image
      image: none # for image

	  
# -- Ignore Status --

# This is the default Status window in RPG Maker.
# Everything in the default window is drawn as one item, 
# and cannot be edited separately because of this.
# To make Status visible again, change the height and width to 100.
	  
  Status:
    type: Window
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 0
    height:
      type: percentage
      value: 0

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

    columns: 1 # max for horizontal menu


layouts:
  MainLayout:
    type: FreeLayout
    components:
      - Background
      - Status

events:
  onSceneEnter:
    # nothing here
	
	
lunatic:
 enable: true
 additionMode: true

 Status:
