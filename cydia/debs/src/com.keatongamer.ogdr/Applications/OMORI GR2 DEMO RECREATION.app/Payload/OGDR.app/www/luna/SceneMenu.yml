type: scene
version: 0.1.0

components:
  Background:
    type: Background
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    background:
      type: default # default | none | image
      image: none # for image

  MenuCommand: SceneMenu_MenuCommand.Base

  Gold: SceneMenu_MenuGold.Base

  # Menu Status
  MenuStatus: SceneMenu_MenuStatus.Base

layouts:
  MainLayout:
    type: FreeLayout
    components:
      - Background
      - BodyLayout


  BodyLayout:
    type: HorizontalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 0
    height:
      type: percentage
      value: 100
    components:
      - LeftColumn
      - RightColumn

  LeftColumn:
    type: FreeLayout
    x:
      type: fixed
      value: 440
    y:
      type: fixed
      value: 0
    width:
      type: fixed
      value: 140
    height:
      type: percentage
      value: 100
    components:
      - MenuCommand
      - Gold

  RightColumn:
    type: FreeLayout
    x:
      type: fixed
      value: -600
    y:
      type: fixed
      value: 0
    width:
      type: fill
      value: 1
    height:
      type: percentage
      value: 100
    components:
      - MenuStatus

events:
  onSceneEnter:
    # nothing here

lunatic:
  MenuCommand: SceneMenu_MenuCommand.Lunatic
  Gold: SceneMenu_MenuGold.Lunatic
  MenuStatus: SceneMenu_MenuStatus.Lunatic
  

