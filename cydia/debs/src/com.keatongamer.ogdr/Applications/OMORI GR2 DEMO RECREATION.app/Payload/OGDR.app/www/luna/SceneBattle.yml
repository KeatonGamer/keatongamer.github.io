type: scene
version: 0.1.0

components:
  # Battle Status
  BattleStatus:
    type: Window
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
    textColor: rgba(0, 0, 0, 1)

    lineHeight: default
    textPadding: default
    windowPadding: default

    gaugeOffset: default
    gaugeHeight: default
    gaugeOutline: default
    gaugeSlanted: default

    windowSkin: default
    cursor:
      type: none # normal / image / none
      blink: true
      image: cursor
      offset:
        x: 0
        y: 0
    customBackground:
      enable: true
      image: none

    columns: 1 # max for horizontal menu

  # Actor Command
  ActorCommand:
    type: Window
    x:
      type: fixed
      value: 21
    y:
      type: fixed
      value: 20
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 290
    height:
      type: fixed
      value: 76
	  
    lineHeight: 36
    textPadding: 0
    windowPadding: 0
    spacing: 0

    textColor: rgba(0, 0, 0, 0)

    windowSkin: 0
    cursor: default
    customBackground:
      enable: false
      image: 

    columns: 2
	

  # Battle Log
  BattleLog:
    type: Window
    x:
      type: fixed
      value: 136
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
    textColor: rgba(0, 0, 0, 1)

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

    columns: 1 # max for horizontal menu

  # Battle Skill
  BattleSkill:
    type: Window
    x:
      type: fixed
      value: 10
    y:
      type: fixed
      value: 50
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 420
    height:
      type: fixed
      value: 100

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
    textColor: rgba(0, 0, 0, 1)

    lineHeight: 40
    textPadding: 0
    windowPadding: 7

    windowSkin: default
    cursor:
      type: image
      blink: true
      image: Item_Select
      offset:
        x: -18
        y: -24
    customBackground:
      enable: false
      image: none

    columns: 2 # max for horizontal menu

  # Battle Item
  BattleItem:
    type: Window
    x:
      type: fixed
      value: 10
    y:
      type: fixed
      value: 50
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 420
    height:
      type: fixed
      value: 200

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
	
    textColor: rgba(0, 0, 0, 1)

    lineHeight: 40
    textPadding: 0
    windowPadding: 7

    windowSkin: default
    cursor:
      type: image
      blink: true
      image: Item_Select
      offset:
        x: -18
        y: -24
    customBackground:
      enable: false
      image: none

    columns: 2 # max for horizontal menu

  # Battle Actor
  BattleActor:
    type: Window
    extend: BattleStatus

  # Battle Enemy
  BattleEnemy:
    type: Window
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 4

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
    textColor: rgba(0, 0, 0, 0)

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: true
      image: none

    columns: 2 # max for horizontal menu

  # Help Window
  Help:
    type: Window
    x:
      type: fixed
      value: 2
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 4

    fontName: RistrettoPro-Regular
    fontSize: 25
    fontOutline: -5
    fontShadow: default
    textColor: rgb(0, 0, 0)

    lineHeight: 25
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: true
      image: Battle-Help

  # Message
  Message:
    type: Window
    x:
      type: fixed
      value: 340
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 350
    height:
      type: fitLines
      value: 4

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default
    textColor: rgba(0, 0, 0, 1)

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

  # Scroll Text
  ScrollText:
    type: Window
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

# YEP Enemy name
  Window_EnemyVisualSelect:
    type: Window

    offset:
      x: 0
      y: 32

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: ""

# YEP VisualHPGauge
  Window_VisualHPGauge:
    type: Window
    offset:
      x: 0
      y: 32

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: ""

layouts:
  MainLayout:
    type: FreeLayout
    components:
      - BattleLog
      - Message
      - ScrollText
      - BattleUILayout
      - Window_EnemyVisualSelect
      - Window_VisualHPGauge

  BattleUILayout:
    type: HorizontalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - BattleStatusLayout
      - CommandMenuLayout

  BattleStatusLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: fixed
      value: 192
    height:
      type: percentage
      value: 100
    components:
      - BattleStatus
      - BattleActor

  CommandMenuLayout:
    type: VerticalLayout
    x:
      type: percentage
      value: 2
    y:
      type: fixed
      value: 0
    width:
      type: fill
      value: 0.94
    height:
      type: fill
      value: 1
    components:
      - HelpLogLayout
      - SkillItemLayout
      - CommandLayout

  HelpLogLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 2
    components:
      - Help

  SkillItemLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: fill
      value: 1
    components:
      - BattleSkill
      - BattleItem

  CommandLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 4
    components:
      - ActorCommand
      - PartyCommand
      - BattleEnemy
      - BattleLog

events:
  onSceneEnter:
    # nothing here

lunatic:
  enable: true
  BattleStatus:
    enable: true
    components:
      ActorFace:
        type: Image
        x:
          type: fixed
          value: -7
        y:
          type: fixed
          value: 166
        anchor:
          x: 0
          y: 0
        imageName: "Menu_Actor${$gameVariables.value(2)}"

      BattlerHPGauge:
        type: gauge
        x:
          type: fixed
          value: -8
        y:
          type: fixed
          value: -8
        anchor:
          x: 0
          y: 0
        pivot:
          x: 0
          y: 0

        bind: true
        width:
          type: fixed
          value: 291
        height:
          type: fixed
          value: 46
        gaugeOutline:
          enable: true
          lineWidth: 1
          lineColor: rgba(16, 16, 16, 1)
        gaugeColor1: "rgb(205, 0, 141)"
        gaugeColor2: "rgb(255, 98, 141)"
        rate: ${data.hpRate}
	  
      BattlerHP:
        type: Text
        x:
          type: fixed
          value: 43
        y:
          type: fixed
          value: 0
        anchor:
          x: 1
          y: 0

        bind: true
        fontName: RistrettoPro-Regular
        fontOutline: -5
        fontSize: 20
        textColor: rgb(255, 255, 255)
        text: "${data.hp}/${data.mhp}"
	 
      BattlerMPGauge:
        type: gauge
        x:
          type: fixed
          value: -8
        y:
          type: fixed
          value: 48
        anchor:
          x: 0
          y: 0
        pivot:
          x: 0
          y: 0

        bind: true
        width:
          type: fixed
          value: 291
        height:
          type: fixed
          value: 46
        gaugeOutline:
          enable: true
          lineWidth: 1
          lineColor: rgba(16, 16, 16, 1)
        gaugeColor1: "rgb(5, 37, 223)"
        gaugeColor2: "rgb(55, 137, 223)"
        rate: ${data.mpRate}
	  
      BattlerMP:
        type: Text
        x:
          type: fixed
          value: 43
        y:
          type: fixed
          value: 56
        anchor:
          x: 1
          y: 0

        bind: true
        fontName: RistrettoPro-Regular
        fontOutline: -5
        fontSize: 20
        textColor: rgb(255, 255, 255)
        text: "${data.mp}/${data.mmp}"
	 
      BattlerEXPGauge:
        type: gauge
        x:
          type: fixed
          value: -8
        y:
          type: fixed
          value: 104
        anchor:
          x: 0
          y: 0
        pivot:
          x: 0
          y: 0

        bind: true
        width:
          type: fixed
          value: 291
        height:
          type: fixed
          value: 46
        gaugeOutline:
          enable: true
          lineWidth: 1
          lineColor: rgba(16, 16, 16, 1)
        gaugeColor1: "rgb(173, 53, 55)"
        gaugeColor2: "rgb(223, 153, 55)"
        rate: ${data.expRate()}
	  
      BattlerEXP:
        type: Text
        x:
          type: fixed
          value: 43
        y:
          type: fixed
          value: 112
        anchor:
          x: 1
          y: 0

        bind: true
        fontName: RistrettoPro-Regular
        fontOutline: -5
        fontSize: 20
        textColor: rgb(255, 255, 255)
        text: "${data.currentExp}/${data.nextLevelExp}" 

      BattlerStates:
        type: grid
        x:
          type: fixed
          value: -4
        y:
          type: fixed
          value: 170
        width:
          type: fixed
          value: 288
        height:
          type: fixed
          value: 32
        anchor:
          x: 0
          y: 0
        horizontal: true
        limit: 8

        bind: true
        itemList: ${data.stateIcons}		
		
        components:
          StateIcon:
            type: icon
            x:
              type: fixed
              value: 0
            y:
              type: fixed
              value: 0
            anchor:
              x: 0
              y: 0
            iconSet: "IconSet"
            iconIndex: "${data}"
        template:
          type: FreeLayout
          components:
            - StateIcon
		
		
    contents:
      type: FreeLayout
      components: []

    lunaticItems:

      itemList: ${party.members}

      template:
        type: FreeLayout
        x:
          type: percentage
          value: 0
        y:
          type: percentage
          value: 0
        anchor:
          x: 0
          y: 0

        components:
          - ActorFace
          - BattlerHPGauge
          - BattlerHP
          - BattlerMPGauge
          - BattlerMP
          - BattlerEXPGauge
          - BattlerEXP	
          - BattlerStates		  

	
  ActorCommand:
    enable: true
    components:
      CommandImage:
        type: image
        x:
          type: fixed
          value: 115
        y:
          type: fixed
          value: 0
        width:
          type: percentage
          value: 100
        height:
          type: percentage
          value: 100
		  
		    
        bind: true
			
        imageName: BattleCommand-idle-${data.name}
        conditions:
          isSelect:
            condition: isSelect
            config:
              imageName: BattleCommand-${data.name}
		
		
    contents:
      type: FreeLayout
      components: []
		
		
    lunaticItems:
      x:
        type: fixed
        value: 0
      y:
        type: fixed
        value: 0
      anchor:
        x: 0
        y: 0

      width:
        type: percentage
        value: 100
      height:
        type: percentage
        value: 100
      bind: true
      itemList: ${data}
      template:
        type: FreeLayout
        components:
          - CommandImage
		

		
		