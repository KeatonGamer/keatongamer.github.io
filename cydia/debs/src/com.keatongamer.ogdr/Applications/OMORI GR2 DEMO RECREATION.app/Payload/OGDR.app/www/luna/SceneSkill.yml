type: scene
version: 0.1.0

components:
  Background:
    type: Background
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    background:
      type: default # default | none | image
      image: none # for image

  # Skill Type
  SkillType:
    type: image
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    fontName: RistrettoPro-Regular
    fontSize: 0
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: true
      image: Skills_Base

    columns: 1 # max for horizontal menu

  # Skill Status
  SkillStatus:
    type: Window
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 1
    height:
      type: fixed
      value: 4

    fontName: RistrettoPro-Regular
    fontSize: 25
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default
    textColor: rgb(0, 0, 0)

    gaugeOffset: default
    gaugeHeight: default
    gaugeOutline: default
    gaugeSlanted: default

    windowSkin: 0
    cursor: default
    customBackground:
      enable: false
      image: none

  # Skill List
  SkillList:
    type: Window
    x:
      type: fixed
      value: 44
    y:
      type: fixed
      value: 170
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 510
    height:
      type: fixed
      value: 300

    fontName: RistrettoPro-Regular
    fontSize: 25
    fontOutline: -5
    fontShadow: default

    lineHeight: 128
    textPadding: default
    windowPadding: 0
    textColor: rgb(0, 0, 0)

    windowSkin: 0
    cursor: default
    customBackground:
      enable: false
      image: none

    verticalAtlas: 2
    columns: 2 # max for horizontal menu

  # Menu Actor
  MenuActor:
    type: Window
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 576
    height:
      type: percentage
      value: 100

    fontName: default
    fontSize: default
    fontOutline: default
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    gaugeOffset: default
    gaugeHeight: default
    gaugeOutline: default
    gaugeSlanted: default

    windowSkin: 0
    cursor: default
    customBackground:
      enable: false
      image: none

    columns: 1 # max for horizontal menu

  # Help Window
  Help:
    type: Window
    x:
      type: fixed
      value: 200
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: fixed
      value: 300

    fontName: RistrettoPro-Regular
    fontSize: 25
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default
    textColor: rgb(0, 0, 0)

    windowSkin: 0
    cursor: default
    customBackground:
      enable: false
      image: none

layouts:
  MainLayout:
    type: FreeLayout
    components:
      - Background
      - SkillLayout
      - ActorsLayout

  SkillLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - TypesStatusLayout
      - SkillList
      - Help
	  
  TypesStatusLayout:
    type: HorizontalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - SkillType
      - SkillStatus

  ActorsLayout:
    type: FreeLayout
    x:
      type: fixed
      value: -15
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - MenuActor

events:
  onSceneEnter:
    # nothing here
	


lunatic:

 SkillType:
  enable: true
  components:
  
   BGName:
     type: Text
     x:
       type: fixed
       value: 28
     y:
       type: fixed
       value: 38
     textColor: rgb(0, 0, 0)
     fontName: RistrettoPro-Regular
     fontSize: 22
     fontOutline: -5
     anchor:
       x: 0
       y: 0
     text: "${actor.name}"
	
   BGLevel:
     type: Text
     x:
       type: fixed
       value: 45
     y:
       type: fixed
       value: 68
     textColor: rgb(0, 0, 0)
     fontName: RistrettoPro-Regular
     fontSize: 22
     fontOutline: -5
     anchor:
       x: 0
       y: 0
     text: "${actor.level}"
  
  
  contents:
   type: FreeLayout
   components: []
	
  lunaticItems:
   itemList: ${data}
   template:
     type: FreeLayout
     components:
       - BGName
       - BGLevel
  

 SkillStatus:
  enable: true
  additionMode: true
  components:

	 
  contents:
   type: FreeLayout
   components: []
	
  lunaticItems:
   itemList: ${data}
   template:
     type: FreeLayout
     components:
       - BattlerName

 SkillList:
  enable: true
  additionMode: true
  components: 
   SkillWindow:

    type: image
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0

    anchor:
      x: 0
      y: 0
	  
    width:
      type: fixed
      value: 274
    height:
      type: fixed
      value: 128

    imageName: "Skills_SkillBG"
	
    conditions:
      isSelect:
        condition: isSelect
        config:
          imageName: "Skills_SkillBGSelect"
		  
   SkillName:
    type: text
    x:
      type: fixed
      value: 70
    y:
      type: fixed
      value: 18
    anchor:
      x: 0
      y: 0
    fontName: RistrettoPro-Regular
    fontSize: 25
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default
    spacing: 0
    textColor: rgb(0, 0, 0)
    text: "${data.name}"
	
    conditions:
      isSelect:
        condition: isSelect
        config:
          x: 
            type: fixed
            value: 70
          y: 
            type: fixed
            value: 14
			
   SkillIcon:
    type: icon
    x:
      type: fixed
      value: 26
    y:
      type: fixed
      value: 20
    anchor:
      x: 0
      y: 0

    iconSet: "IconSet"
    iconIndex: "${data.iconIndex}"
	
    conditions:
      isSelect:
        condition: isSelect
        config:
          x: 
            type: fixed
            value: 26
          y: 
            type: fixed
            value: 16
			
   MPCost:
    type: text
    x:
      type: fixed
      value: 70
    y:
      type: fixed
      value: 74
    anchor:
      x: 0
      y: 0
    fontName: RistrettoPro-Regular
    fontSize: 20
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default
    spacing: 0
    textColor: rgb(0, 0, 0)
    text: "aaaaa"
	
    conditions:
      isSelect:
        condition: isSelect
        config:
          x: 
            type: fixed
            value: 70
          y: 
            type: fixed
            value: 70
			
   SkillScope:
    type: image
    x:
      type: fixed
      value: 216
    y:
      type: fixed
      value: 76
    anchor:
      x: 0
      y: 0

    imageName: "SkillType_${data.scope}"
	
    conditions:
      isSelect:
        condition: isSelect
        config:
          x: 
            type: fixed
            value: 216
          y: 
            type: fixed
            value: 72
			

  contents:
   type: FreeLayout
   components: []
	
  lunaticItems:
   itemList: ${data}
   template:
     type: FreeLayout
     components:
       - SkillWindow
       - SkillName
       - SkillIcon
       - MPCost
       - SkillScope
	   
