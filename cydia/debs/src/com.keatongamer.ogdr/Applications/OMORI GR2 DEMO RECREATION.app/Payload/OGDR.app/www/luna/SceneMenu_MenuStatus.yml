Base:
  type: Window
  x:
    type: fixed
    value: 0
  y:
    type: fixed
    value: 0
  anchor:
    x: 0
    y: 0

  width:
    type: percentage
    value: 100
  height:
    type: percentage
    value: 100

  fontName: RistrettoPro-Regular
  fontSize: 25
  fontOutline: -5
  fontShadow: default

  lineHeight: default
  textPadding: default
  windowPadding: default
  spacing: 0

  gaugeBackColor: rgba(0,0,0,0)

  windowSkin: default
  cursor: default
  customBackground:
    enable: true
    image: none

  columns: 1 # max for horizontal menu

  
Lunatic:
  enable: true
  components:
    BattlerBack:
      type: image
      x:
        type: fixed
        value: 4
      y:
        type: fixed
        value: -8
      anchor:
        x: 0
        y: 0
      imageName: "MainMenu_ActorInfo"
    BattlerBackSelect:
      type: image
      x:
        type: fixed
        value: 183
      y:
        type: fixed
        value: 116
      anchor:
        x: 0
        y: 0
      imageName: "MainMenu_ActorSelect"
      visible: false
      conditions:
        isSelect:
          condition: isSelect
          config: 
            imageName: "MainMenu_ActorSelect"
            visible: true
			
          visible: true
    # BattlerFace:
      # type: face
      # x:
        # type: fixed
        # value: 16
      # y:
        # type: fixed
        # value: 4	
      # anchor:
        # x: 0
        # y: 0
      # scale:
        # x: 1
        # y: 1
      # faceName: "${data.faceName}"
      # faceIndex: "${data.faceIndex}"
    ActorPicture:
      type: Image
      x:
        type: fixed
        value: 184
      y:
        type: fixed
        value: 118
      anchor:
        x: 0
        y: 0
      imageName: "Menu_Actor${$gameVariables.value(2)}"
	  
    ActorType:
      type: Image
      x:
        type: fixed
        value: 586
      y:
        type: fixed
        value: 64
      anchor:
        x: 0
        y: 0
      imageName: "ActorType_${$gameVariables.value(1)}"
    BattlerName:
      type: Text
      x:
        type: fixed
        value: 430
      y:
        type: fixed
        value: 7
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      text: "${data.name}"
    BattlerNickname:
      type: Text
      x:
        type: fixed
        value: 430
      y:
        type: fixed
        value: 60
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      text: "${data.nickname}"
    BattlerLevel:
      type: Text
      x:
        type: fixed
        value: 590
      y:
        type: fixed
        value: 7
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      text: "${data.level}"
    ActorDescription:
      type: Text
      x:
        type: fixed
        value: 30
      y:
        type: fixed
        value: 4
      width:
        type: fixed
        value: 280
      height:
        type: fitLines
        value: 2
      textColor: rgb(0, 0, 0)
      anchor:
        x: 0
        y: 0
      text: "${data.profile}"
    BattlerHPGauge:
      type: gauge
      x:
        type: fixed
        value: 13
      y:
        type: fixed
        value: 408
      anchor:
        x: 0
        y: 0
      pivot:
        x: 0
        y: 0
      rotation: 270
      bind: true
      width:
        type: fixed
        value: 291
      height:
        type: fixed
        value: 46

      gaugeOutline:
        enable: true
        lineWidth: 1
        lineColor: rgba(16, 16, 16, 1)
      gaugeColor1: "rgb(205, 0, 141)"
      gaugeColor2: "rgb(255, 98, 141)"

      rate: ${data.hpRate}
    BattlerHP:
      type: Text
      x:
        type: fixed
        value: 20
      y:
        type: fixed
        value: 360
      anchor:
        x: 1
        y: 0
      rotation: 270
      bind: true
      fontName: RistrettoPro-Regular
      fontSize: 20
      textColor: rgb(255, 255, 255)
      text: "${data.hp}/${data.mhp}"
    BattlerMPGauge:
      type: gauge
      x:
        type: fixed
        value: 67
      y:
        type: fixed
        value: 408
      anchor:
        x: 0
        y: 0
      pivot:
        x: 0
        y: 0
      rotation: 270
      bind: true
      width:
        type: fixed
        value: 291
      height:
        type: fixed
        value: 46

      gaugeOutline:
        enable: true
        lineWidth: 1
        lineColor: rgba(16, 16, 16, 1)
      gaugeColor1: "rgb(5, 37, 223)"
      gaugeColor2: "rgb(55, 137, 223)"

      rate: ${data.mpRate}
    BattlerMP:
      type: Text
      x:
        type: fixed
        value: 75
      y:
        type: fixed
        value: 360
      anchor:
        x: 1
        y: 0
      rotation: 270
      bind: true
      fontName: RistrettoPro-Regular
      fontSize: 20
      textColor: rgb(255, 255, 255)
      text: "${data.mp}/${data.mmp}"
    BattlerEXPGauge:
      type: gauge
      x:
        type: fixed
        value: 121
      y:
        type: fixed
        value: 408
      anchor:
        x: 0
        y: 0
      pivot:
        x: 0
        y: 0
      rotation: 270
      bind: true
      width:
        type: fixed
        value: 291
      height:
        type: fixed
        value: 46

      gaugeOutline:
        enable: true
        lineWidth: 1
        lineColor: rgba(16, 16, 16, 1)
      gaugeColor1: "rgb(173, 53, 55)"
      gaugeColor2: "rgb(223, 153, 55)"

      rate: ${data.expRate()}
    BattlerEXP:
      type: Text
      x:
        type: fixed
        value: 129
      y:
        type: fixed
        value: 360
      anchor:
        x: 1
        y: 0
      rotation: 270
      bind: true
      fontName: RistrettoPro-Regular
      fontSize: 20
      textColor: rgb(255, 255, 255)
      text: "${actor.currentExp}/${actor.nextLevelExp}"

    BattleStates:
      type: grid
      x:
        type: fixed
        value: 186
      y:
        type: fixed
        value: 119
      width:
        type: fixed
        value: 288
      height:
        type: fixed
        value: 32
      anchor:
        x: 0
        y: 0
      horizontal: true
      limit: 8

      bind: true
      itemList: ${data.stateIcons}

      components:
        StateIcon:
          type: icon
          x:
            type: fixed
            value: 0
          y:
            type: fixed
            value: 0
          anchor:
            x: 0
            y: 0
          iconSet: "IconSet"
          iconIndex: "${data}"
      template:
        type: FreeLayout
        components:
          - StateIcon

		  
  contents:
    type: FreeLayout
    components: []

  lunaticItems:
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    itemList: ${party.members}

    template:
      type: FreeLayout
      components:
        - BattlerBack
        - BattlerBackSelect
        - ActorPicture
        - ActorType
        - BattlerName
        - BattlerNickname
        - ActorDescription
        - BattlerLevel
        - BattlerHPGauge
        - BattlerHP
        - BattlerMPGauge
        - BattlerMP
        - BattlerEXPGauge
        - BattlerEXP
        - BattleStates
	
