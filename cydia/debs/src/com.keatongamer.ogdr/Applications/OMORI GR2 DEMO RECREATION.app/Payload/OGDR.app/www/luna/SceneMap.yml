type: scene
version: 0.1.0

components:
  MapName:
    type: Window
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: fixed
      value: 360
    height:
      type: fitLines
      value: 1

    fontName: default
    fontSize: default
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

  # Message
  Message:
    type: Window
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 100
    anchor:
      x: 0
      y: 1

    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 4

    fontName: default
    fontSize: default
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

  # Scroll Text
  ScrollText:
    type: Window
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    fontName: default
    fontSize: default
    fontOutline: -5
    fontShadow: default

    lineHeight: default
    textPadding: default
    windowPadding: default

    windowSkin: default
    cursor: default
    customBackground:
      enable: false
      image: none

# This actually does nothing, just leave here so people know Layout can be setup here
layouts:
  MainLayout:
    type: FreeLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - MapName
      - Message
      - ScrollText

events:
  onSceneEnter:
    # nothing here
