Base:
  type: Window
  x:
    type: fixed
    value: 16
  y:
    type: fixed
    value: 0
  anchor:
    x: 0
    y: 0

  width:
    type: percentage
    value: 100
  height:
    type: percentage
    value: 100

  fontName: default
  fontSize: default
  fontOutline: default
  fontShadow: default

  lineHeight: 36
  textPadding: default
  windowPadding: default
  spacing: 0

  windowSkin: default
  cursor: default
  customBackground:
    enable: true
    image: MainMenu_Base
    offset:
      x: -456
      y: 0

  columns: 1 # max for horizontal menu

Lunatic:
  enable: true
  components:
    CommandImage:
      type: image
      x:
        type: percentage
        value: 0
      y:
        type: fixed
        value: 112
      verticalAtlas: 8
      anchor:
        x: 0
        y: 0
      imageName: "MainMenuChoices_Idle"
      conditions:
        isSelect:
          condition: isSelect
          config:
            imageName: "MainMenuChoices_Select"

  contents:
    type: FreeLayout
    components: []

  lunaticItems:
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    itemList: ${data}

    template:
      type: FreeLayout
      components:
       - CommandImage
