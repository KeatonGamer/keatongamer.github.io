<!DOCTYPE html>
<html manifest="ogdr.manifest">
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/ios_icon.png">
		<link rel="apple-touch-startup-image" href="icon/ios_startup.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css", media="screen, mobile" title="main" charset="utf-8">
        <title>OMORI GR2 DEMO RECREATION</title>
		<script>
			/* Storing user's device details in a variable*/
			let details = navigator.userAgent;

			/* Creating a regular expression 
			containing some mobile devices keywords 
			to search it in details string*/
			let regexp = /android|iphone|kindle|ipad/i;

			/* Using test() method to search regexp in details
			it returns boolean value*/
			let isMobileDevice = regexp.test(details);

			if (isMobileDevice) {
				window.location.replace("mobile.html");
			} else {
				window.location.replace("desktop.html");
			}
		</script>
    </head>
    <body style="background-color: black">
    </body>
</html>
