type: scene
version: 0.1.0

components:
  Background:
    type: Background
    x:
      type: percentage
      value: 0
    y:
      type: percentage
      value: 0
    anchor:
      x: 0
      y: 0

    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100

    background:
      type: default
      image: none

  EquipStatus: SceneEquip_EquipStatus.Base

  EquipCommand: SceneEquip_EquipCommand.Base

  EquipSlot: SceneEquip_EquipSlot.Base

  EquipItem: SceneEquip_EquipItem.Base

  # Help Window
  Help: SceneEquip_Help.Base

layouts:
  MainLayout:
    type: FreeLayout
    components:
      - Background
      - BodyLayout

  BodyLayout:
    type: VerticalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: percentage
      value: 100
    components:
      - CommandSlotLayout
      - StatusItemLayout
      - Help

  CommandSlotLayout:
    type: HorizontalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: fitLines
      value: 6
    components:
      - EquipCommand
      - EquipSlot

  StatusItemLayout:
    type: HorizontalLayout
    x:
      type: fixed
      value: 0
    y:
      type: fixed
      value: 0
    width:
      type: percentage
      value: 100
    height:
      type: fill
      value: 1
    components:
      - EquipStatus
      - EquipItem

events:
  onSceneEnter:
    # nothing here

lunatic:
 enable: true
 EquipCommand: SceneEquip_EquipCommand.Lunatic
 EquipSlot: SceneEquip_EquipSlot.Lunatic
 EquipItem: SceneEquip_EquipItem.Lunatic
 EquipStatus: SceneEquip_EquipStatus.Lunatic
 Help: SceneEquip_Help.Lunatic
  
