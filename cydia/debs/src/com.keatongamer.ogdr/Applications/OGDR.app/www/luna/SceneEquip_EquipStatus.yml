Base:
  type: Window
  x:
    type: fixed
    value: 0
  y:
    type: fixed
    value: -12
  anchor:
    x: 0
    y: 0

  width:
    type: fixed
    value: 260
  height:
    type: percentage
    value: 100

  fontName: Nikaia
  fontSize: 16
  fontOutline: default
  fontShadow: default

  lineHeight: 20
  textPadding: 0
  windowPadding: default

  gaugeOffset: default
  gaugeHeight: default
  gaugeOutline: default
  gaugeSlanted: default

  windowSkin: default
  cursor: default
  customBackground:
    enable: true
    image: none

Lunatic:
  enable: true
  components:
    ActorName:
      type: Text
      x:
        type: fixed
        value: 28
      y:
        type: fixed
        value: -60
      anchor:
        x: 0
        y: 0
      fontName: RistrettoPro-Regular
      fontSize: 25
      fontOutline: -5
      fontShadow: default
      textColor: rgb(0, 0, 0)
      text: "${actor.name}"
	  
    ActorLevel:
      type: Text
      x:
        type: fixed
        value: 216
      y:
        type: fixed
        value: -60
      anchor:
        x: 0
        y: 0
      fontName: RistrettoPro-Regular
      fontSize: 25
      fontOutline: -5
      fontShadow: default
      textColor: rgb(0, 0, 0)
