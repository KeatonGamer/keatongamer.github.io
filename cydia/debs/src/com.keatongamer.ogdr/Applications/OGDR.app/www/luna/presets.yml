type: presets
version: 0.1.0

presets:
  default:
    fontName: RistrettoPro-Regular
    fontSize: 28
    fontOutline: -5
    fontShadow:
      enable: false
      shadowOffset:
        x: 2
        y: 2
      shadowColor: rgba(32, 32, 32, 0.6)
      shadowBlur: 4
    textColor: rgba(255, 255, 255, 1)

    lineHeight: 28
    textPadding: 20
    windowPadding: 16
    contentsOffset:
      x: 0
      y: 0
    spacing: 12

    gaugeOffset:
      x: 0
      y: 4
    gaugeHeight: 16
    gaugeOutline:
      enable: true
      lineWidth: 2
      lineColor: rgba(16, 16, 16, 1)
    gaugeSlanted: false
    gaugeBackColor: rgba(4, 4, 4, 1)

    windowSkin: Window
    cursor:
      type: none # normal / image / none
      blink: false
      image: none
      offset:
        x: 0
        y: 6
